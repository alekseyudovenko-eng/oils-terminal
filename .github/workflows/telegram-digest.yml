name: 📰 Telegram News Digest (manual)

# Ежедневную отправку делает Vercel Cron (vercel.json, 08:00 UTC).
# Этот workflow оставлен только для ручного запуска, чтобы дайджест не дублировался.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call news digest
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://${{ secrets.VERCEL_URL }}/api/cron/news-digest")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Failed"
            exit 1
          fi
          echo "✅ Sent to Telegram"
